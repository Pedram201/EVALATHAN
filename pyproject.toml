[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalathan"
version = "0.3.0"
description = "Hydra conducts sixteen software evalers. Dehydrus conducts seven PRETRUWs physical-world evalers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Evalathan" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalathan = "evalathan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalathan = ["hydra-logo.png", "dehydrus-logo.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
